[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinycopilot"
version = "0.1.0"
description = "A compact Python re-implementation of ListenToMe's on-device meeting-copilot core - the Module 2/3 lab for AI Product Studio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let tests and demo import the package without installing it.
pythonpath = ["src"]
markers = [
    "e2e: real-LLM contract tests; require a running Ollama daemon and LAB_E2E=1",
]