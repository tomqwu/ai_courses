[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniflow"
version = "0.1.0"
description = "mini-flow: a lab-scale FastAPI + SQLAlchemy + JWT multi-tenant starter mirroring SignUpFlow's auth shape - the Module 5 lab for AI Product Studio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "PyJWT>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let tests and demo import the package (and tests.playbooks) without installing it.
pythonpath = ["src", "."]
filterwarnings = [
    # starlette>=1.6 prefers the httpx2 package for TestClient; httpx works and is what the course pins.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Raised inside starlette's own testclient module, not by mini-flow.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
markers = [
    "lab: Lab M5 graded hooks; skipped until MINIFLOW_LAB_STEPS names the step",
]
